<!DOCTYPE html>
<html>
<head>
    <title>School Management Dashboard</title>
    <style>
        /* ਤੁਹਾਡਾ CSS ਇੱਥੇ ਪੇਸਟ ਕਰੋ */
        :root{--nav:#0f2a35;--nav-light:#173947;--accent:#168a75;--ink:#18212f;--muted:#657286;--line:#d9e0ea;--page:#eef3f7;--card:#fff}
        body{display:grid;grid-template-columns:270px 1fr;min-height:100vh;margin:0;background:var(--page);font-family:Arial,sans-serif}
        .sidebar{background:var(--nav);color:white;padding:24px}
        .content{padding:28px}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
        .panel{background:var(--card);padding:20px;border-radius:8px;border:1px solid var(--line)}
        table{width:100%;border-collapse:collapse}
        th,td{border-bottom:1px solid var(--line);padding:14px;text-align:left}
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>NS NewSchool</h2>
        <p>Dashboard</p>
        <p>Students</p>
        <p>Attendance</p>
    </div>
    <div class="content">
        <h1>Professional School Management Software</h1>
        <div class="stats">
            <div class="panel">Total Students<br><strong>5</strong></div>
            <div class="panel">Attendance<br><strong>94%</strong></div>
            <div class="panel">Fees<br><strong>$42,860</strong></div>
            <div class="panel">Notices<br><strong>7</strong></div>
        </div>
        <div class="panel">
            <h3>Student Directory</h3>
            <table>
                <tr><th>NAME</th><th>CLASS</th><th>ROLL</th><th>FEE STATUS</th></tr>
                <tr><td>Arshdeep Singh</td><td>Basic</td><td>124</td><td>Paid</td></tr>
            </table>
        </div>
    </div>
</body>
</html>
