<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>School Management Dashboard</title>
    <style>
        /* ਇੱਥੇ ਤੁਹਾਡਾ ਉਹ CSS ਹੈ ਜੋ ਤੁਸੀਂ ਹੁਣੇ ਭੇਜਿਆ ਸੀ */
        :root{--nav:#0f2a35;--nav-light:#173947;--accent:#168a75;--ink:#18212f;--muted:#657286;--line:#d9e0ea;--page:#eef3f7;--card:#fff}
        *{box-sizing:border-box}body{display:grid;grid-template-columns:270px 1fr;min-height:100vh;margin:0;background:var(--page);color:var(--ink);font-family:Arial,sans-serif}
        /* ਬਾਕੀ CSS ਇੱਥੇ ਰਹੇਗਾ... */
        .content{padding:40px; text-align:center;}
        h1{color:#0f2a35;}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><h2>School Portal</h2></div>
        <button class="nav active">Dashboard</button>
    </div>
    <div class="content">
        <h1>Welcome to ArshBal School Management</h1>
        <p>ਤੁਹਾਡਾ ਡੈਸ਼ਬੋਰਡ ਤਿਆਰ ਹੈ!</p>
    </div>
</body>
</html>
